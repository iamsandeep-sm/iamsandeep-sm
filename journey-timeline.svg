<text x='592' y='291' font-size='16' fill='#38bdf8' font-family='Verdana, Arial, sans-serif' font-weight='700' letter-spacing='0.3'>Reflection Period</text>
<text x='592' y='319' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>After Class 12, I intentionally</text>
<text x='592' y='338' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>chose not to join college right</text>
<text x='592' y='357' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>away.</text>
<text x='592' y='395' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>The COVID-19 pandemic had</text>
<text x='592' y='414' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>significantly disrupted my Class 11</text>
<text x='592' y='433' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>and 12 education, slowing my</text>
<text x='592' y='452' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>academic momentum. Rather than</text>
<text x='592' y='471' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>rushing forward, I took this time to</text>
<text x='592' y='490' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>rethink my career direction, prepare</text>
<text x='592' y='509' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>for entrance exams, and grow</text>
<text x='592' y='528' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>personally — a deliberate pause for</text>
<text x='592' y='547' font-size='13' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif'>self-discovery, not a gap.</text>
