<rect x='0' y='0' width='1400' height='900' fill='#080b14'/><line x1='60' y1='70' x2='330' y2='70' stroke='#6d5bd0' stroke-width='2' opacity='0.6'/><circle cx='60' cy='70' r='4' fill='#6d5bd0'/><path d='M 330 70 L 400 70 L 420 52 L 460 52 L 480 70' stroke='#6d5bd0' stroke-width='2' fill='none' opacity='0.6'/><line x1='1340' y1='70' x2='1070' y2='70' stroke='#6d5bd0' stroke-width='2' opacity='0.6'/><circle cx='1340' cy='70' r='4' fill='#6d5bd0'/><path d='M 1070 70 L 1000 70 L 980 52 L 940 52 L 920 70' stroke='#6d5bd0' stroke-width='2' fill='none' opacity='0.6'/><text x='675.0' y='77' font-size='26' text-anchor='middle'>👤</text><text x='755.0' y='80' font-size='34' text-anchor='middle' fill='url(#titleGrad)' font-family='Verdana, Arial, sans-serif' font-weight='800' letter-spacing='1'>ABOUT ME</text><rect x='660.0' y='105' width='80' height='4' rx='2' fill='#8A63FF'/><rect x='90' y='145' width='1220' height='100' rx='16' fill='#0d1420' stroke='#2a3346' stroke-width='1.5'/><text x='120' y='190' font-size='36' fill='#8A63FF' font-family='Verdana, Arial, sans-serif' font-weight='800'>&#8220;</text><text x='1280' y='225' font-size='36' text-anchor='end' fill='#8A63FF' font-family='Verdana, Arial, sans-serif' font-weight='800'>&#8221;</text><text x='700.0' y='187' font-size='16' text-anchor='middle' fill='#e5e7eb' font-family='Verdana, Arial, sans-serif'>I'm a software developer and web development enthusiast from <tspan fill='#a78bfa' font-weight='700'>Uttarakhand, India 🇮🇳</tspan>,</text><text x='700.0' y='215' font-size='16' text-anchor='middle' fill='#e5e7eb' font-family='Verdana, Arial, sans-serif'>driven by curiosity and a steady commitment to growth.</text><line x1='168' y1='290' x2='168' y2='714' stroke='#2a3346' stroke-width='2'/><circle cx='168' cy='290' r='6' fill='#8A63FF'/><rect x='210' y='252' width='1100' height='76' rx='14' fill='#0d1420' stroke='#2a3346' stroke-width='1.5'/><circle cx='252' cy='290' r='30' fill='#8A63FF' opacity='0.15' filter='url(#glow)'/><circle cx='252' cy='290' r='26' fill='#0d1420' stroke='#8A63FF' stroke-width='2.5'/><text x='252' y='299' font-size='24' text-anchor='middle'>🎓</text><text x='300' y='295' font-size='14.5' font-family='Verdana, Arial, sans-serif'><tspan fill='#e5e7eb' font-weight='400'>Graduated with a </tspan><tspan fill='#a78bfa' font-weight='700'>Bachelor of Computer Applications (BCA)</tspan><tspan fill='#e5e7eb' font-weight='400'> from </tspan><tspan fill='#ffffff' font-weight='700'>Graphic Era Hill University</tspan></text><circle cx='168' cy='386' r='6' fill='#38bdf8'/><rect x='210' y='348' width='1100' height='76' rx='14' fill='#0d1420' stroke='#2a3346' stroke-width='1.5'/><circle cx='252' cy='386' r='30' fill='#38bdf8' opacity='0.15' filter='url(#glow)'/><circle cx='252' cy='386' r='26' fill='#0d1420' stroke='#38bdf8' stroke-width='2.5'/><text x='252' y='395' font-size='24' text-anchor='middle'>📖</text><text x='300' y='391' font-size='14.5' font-family='Verdana, Arial, sans-serif'><tspan fill='#e5e7eb' font-weight='400'>Currently pursuing a </tspan><tspan fill='#38bdf8' font-weight='700'>Master of Computer Applications (MCA)</tspan><tspan fill='#e5e7eb' font-weight='400'> from </tspan><tspan fill='#ffffff' font-weight='700'>Lovely Professional University (LPU)</tspan></text><circle cx='168' cy='482' r='6' fill='#f472b6'/><rect x='210' y='444' width='1100' height='76' rx='14' fill='#0d1420' stroke='#2a3346' stroke-width='1.5'/><circle cx='252' cy='482' r='30' fill='#f472b6' opacity='0.15' filter='url(#glow)'/><circle cx='252' cy='482' r='26' fill='#0d1420' stroke='#f472b6' stroke-width='2.5'/><text x='252' y='491' font-size='24' text-anchor='middle'>🧠</text><text x='300' y='487' font-size='14.5' font-family='Verdana, Arial, sans-serif'><tspan fill='#e5e7eb' font-weight='400'>I enjoy </tspan><tspan fill='#f472b6' font-weight='700'>solving problems</tspan><tspan fill='#e5e7eb' font-weight='400'>, building real-world projects, and exploring modern technologies</tspan></text><circle cx='168' cy='578' r='6' fill='#4ade80'/><rect x='210' y='540' width='1100' height='76' rx='14' fill='#0d1420' stroke='#2a3346' stroke-width='1.5'/><circle cx='252' cy='578' r='30' fill='#4ade80' opacity='0.15' filter='url(#glow)'/><circle cx='252' cy='578' r='26' fill='#0d1420' stroke='#4ade80' stroke-width='2.5'/><text x='252' y='587' font-size='24' text-anchor='middle'>🌱</text><text x='300' y='583' font-size='14.5' font-family='Verdana, Arial, sans-serif'><tspan fill='#e5e7eb' font-weight='400'>I approach learning the way a software engineer approaches a codebase — one </tspan><tspan fill='#4ade80' font-weight='700'>clean</tspan><tspan fill='#e5e7eb' font-weight='400'>, </tspan><tspan fill='#4ade80' font-weight='700'>deliberate</tspan><tspan fill='#e5e7eb' font-weight='400'> iteration at a time</tspan></text><circle cx='168' cy='674' r='6' fill='#fbbf24'/><rect x='210' y='636' width='1100' height='76' rx='14' fill='#0d1420' stroke='#2a3346' stroke-width='1.5'/><circle cx='252' cy='674' r='30' fill='#fbbf24' opacity='0.15' filter='url(#glow)'/><circle cx='252' cy='674' r='26' fill='#0d1420' stroke='#fbbf24' stroke-width='2.5'/><text x='252' y='683' font-size='24' text-anchor='middle'>⚡</text><text x='300' y='679' font-size='15' font-family='Verdana, Arial, sans-serif'><tspan fill='#fbbf24' font-weight='700'>Consistency</tspan><tspan fill='#e5e7eb' font-weight='400'> over intensity — that's the principle I build my growth around</tspan></text><line x1='90' y1='744' x2='458.4' y2='744' stroke='#2a3346' stroke-width='1.5'/><circle cx='90' cy='744' r='4' fill='#6d5bd0'/><line x1='1310' y1='744' x2='941.6' y2='744' stroke='#2a3346' stroke-width='1.5'/><circle cx='1310' cy='744' r='4' fill='#6d5bd0'/><rect x='478.4' y='722' width='443.20000000000005' height='44' rx='22' fill='#0d1420' stroke='#2a3346' stroke-width='1.5'/><text x='700.0' y='750' font-size='14.5' text-anchor='middle' fill='#c9d1d9' font-family='Verdana, Arial, sans-serif' font-weight='600'>&lt;/&gt; • Curious • Consistent • Always Learning • ✨</text></svg>
